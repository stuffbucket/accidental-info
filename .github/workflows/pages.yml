name: Pages

# Edits that can't change the site or its files don't build it: guides' notes, the plans, the contributor docs and
# the issue forms. (README.md does build: the pipeline's test checks its list of guides.)
on:
  push:
    branches: [main]
    paths-ignore: &ignored
      - "**/notes/**"
      - "docs/**"
      - "packages/editorial/design/**"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSE-TEXT"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore: *ignored
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds every guide (failing if a PDF differs from its expected.sha256), tests them and the site, and on main
  # deploys the site. Guides whose sources didn't change come from the Turborepo cache.
  site:
    uses: ./.github/workflows/astro-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      site-dir: site
      build-command: pnpm turbo run build test
      turbo: true
      # The guides' Python packages, and the reader's page images, which are kept by each PDF's hash.
      cache-paths: |
        .venv
        site/node_modules/.cache/guide-pages
      cache-key-files: |
        pnpm-lock.yaml
        mise.toml
        packages/pipeline/requirements.txt
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      # The guides' list and files, for the release job.
      artifact-name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'guides' || '' }}
      artifact-path: |
        site/public/guides.json
        site/public/guides/*.pdf
        site/public/guides/*.docx

  # A GitHub release for each guide version without a tag yet: tag <slug>-v<version>, the PDF and Word files
  # attached, drafts marked as prereleases. Versions that already have a tag are skipped.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: site/scripts/release.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guides
          path: ${{ runner.temp }}/guides
      - name: Create releases
        run: python3 site/scripts/release.py "$RUNNER_TEMP/guides"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SITE_ORIGIN: ${{ needs.site.outputs.origin }}
          SITE_BASE: ${{ needs.site.outputs.base_path }}
          TARGET: ${{ github.sha }}
